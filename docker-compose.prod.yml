services:
  postgres:
    ports: !reset []
    restart: unless-stopped
  redis:
    ports: !reset []
    restart: unless-stopped

  api:
    image: ghcr.io/ciq312/fasternfaster-api:${IMAGE_TAG:?set IMAGE_TAG to the deployed commit SHA}
    build: !reset null
    ports: !reset []
    pull_policy: missing
    restart: unless-stopped
    environment:
      DOTNET_SYSTEM_NET_DISABLEIPV6: "1"

  frontend:
    image: ghcr.io/ciq312/fasternfaster-frontend:${IMAGE_TAG:?set IMAGE_TAG to the deployed commit SHA}
    build: !reset null
    ports: !reset []
    pull_policy: missing
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  caddy_data:
  caddy_config:
