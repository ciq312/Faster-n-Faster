name: CICD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  backend-build:

    runs-on: ubuntu-latest
    
    env:
      Solution_name: FasterNFaster.Api.sln
      Test_project_path: FasterNFaster.UnitTests/FasterNFaster.UnitTests.csproj


    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
    - name: Restore dependencies
      run: dotnet restore  ${{ env.Solution_name }}
    - name: Build
      run: dotnet build  ${{ env.Solution_name }} --no-restore
    - name: Check formatting
      run: dotnet format ${{ env.Solution_name }} --verify-no-changes --no-restore
    - name: Test
      run: dotnet test  ${{ env.Test_project_path }} --no-build --verbosity normal

  integration-tests:
    runs-on: ubuntu-latest

    env:
      Integration_project_path: FasterNFaster.IntegrationTests/FasterNFaster.IntegrationTests.csproj

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
    - name: Restore dependencies
      run: dotnet restore ${{ env.Integration_project_path }}
    - name: Test
      run: dotnet test ${{ env.Integration_project_path }} --verbosity normal

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fasternfasterapp
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: fasternfasterapp/package-lock.json
    - run: npm ci
    - run: npm run lint
    - run: npm run format:check
    - run: npm run build

  publish-api:
    needs: [backend-build, integration-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/build-push-action@v6
      with:
        context: .
        file: FasterNFaster.Api.Presentation/Dockerfile
        push: true
        tags: |
          ghcr.io/ciq312/fasternfaster-api:latest
          ghcr.io/ciq312/fasternfaster-api:${{ github.sha }}

  publish-frontend:
    needs: frontend-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/build-push-action@v6
      with:
        context: ./fasternfasterapp
        push: true
        tags: |
          ghcr.io/ciq312/fasternfaster-frontend:latest
          ghcr.io/ciq312/fasternfaster-frontend:${{ github.sha }}

  deploy:
    needs: [publish-api, publish-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    with:
      sha: ${{ github.sha }}
    secrets: inherit
