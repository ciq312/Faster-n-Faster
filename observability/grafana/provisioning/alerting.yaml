apiVersion: 1
groups:
  - orgId: 1
    name: Faster-n-Faster API
    folder: Faster-n-Faster
    interval: 20s
    rules:
      - uid: fnf-api-readiness
        title: API readiness probes stopped succeeding
        dashboardUid: fnf-api-local
        panelId: 9
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 120, to: 0 }
            model:
              refId: A
              datasource: { type: prometheus, uid: prometheus }
              instant: true
              range: false
              expr: >-
                sum(increase(http_server_request_duration_seconds_count{job="faster-n-faster-api",http_route="/api/health",http_response_status_code="200"}[2m]))
                or vector(0)
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: { from: 0, to: 0 }
            model:
              refId: B
              datasource: { type: __expr__, uid: __expr__ }
              type: math
              expression: $A == 0
        for: 2m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: No successful readiness probe in the last two minutes
          description: Check /api/health, PostgreSQL and Redis, and whether the API exports metrics.
      - uid: fnf-api-http-5xx
        title: API HTTP 5xx rate is elevated
        dashboardUid: fnf-api-local
        panelId: 2
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: A
              datasource: { type: prometheus, uid: prometheus }
              instant: true
              range: false
              expr: >-
                sum(increase(http_server_request_duration_seconds_count{job="faster-n-faster-api",http_route!="/api/health",http_response_status_code=~"5.."}[5m]))
                or vector(0)
          - refId: B
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: B
              datasource: { type: prometheus, uid: prometheus }
              instant: true
              range: false
              expr: >-
                sum(increase(http_server_request_duration_seconds_count{job="faster-n-faster-api",http_route!="/api/health"}[5m]))
                or vector(0)
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: { from: 0, to: 0 }
            model:
              refId: C
              datasource: { type: __expr__, uid: __expr__ }
              type: math
              expression: ($B >= 20) && ($A >= $B * 0.05)
        for: 2m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: At least 5% of 20 or more requests returned HTTP 5xx in the last five minutes
          description: Use the dashboard to check request volume and inspect traces for failing routes.
