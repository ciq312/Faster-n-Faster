server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

overrides:
  defaults:
    ingestion:
      rate_limit_bytes: 1048576
      burst_size_bytes: 2097152
    global:
      max_bytes_per_trace: 262144
    compaction:
      block_retention: ${OBSERVABILITY_TEMPO_RETENTION:-48h}

usage_report:
  reporting_enabled: false
