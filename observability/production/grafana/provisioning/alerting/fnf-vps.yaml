apiVersion: 1
groups:
  - orgId: 1
    name: Faster-n-Faster VPS
    folder: Faster-n-Faster
    interval: 30s
    rules:
      - uid: fnf-vps-filesystem-space
        title: VPS filesystem space is low
        dashboardUid: fnf-vps
        panelId: 4
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: A
              datasource: { type: prometheus, uid: prometheus }
              instant: true
              range: false
              expr: >-
                100 * node_filesystem_avail_bytes{job="node-exporter",device=~"/dev/.+",fstype!~"vfat|msdos"}
                / (node_filesystem_size_bytes{job="node-exporter",device=~"/dev/.+",fstype!~"vfat|msdos"} > 0)
                and (node_filesystem_readonly{job="node-exporter",device=~"/dev/.+",fstype!~"vfat|msdos"} == 0)
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: { from: 0, to: 0 }
            model:
              refId: B
              datasource: { type: __expr__, uid: __expr__ }
              type: math
              expression: $A < 15
        for: 5m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'Less than 15% of space is available on {{ $labels.mountpoint }}'
          description: Check the filesystem for available space and review storage used by containers and observability data.
      - uid: fnf-vps-filesystem-inodes
        title: VPS filesystem inodes are low
        dashboardUid: fnf-vps
        panelId: 5
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: A
              datasource: { type: prometheus, uid: prometheus }
              instant: true
              range: false
              expr: >-
                100 * node_filesystem_files_free{job="node-exporter",device=~"/dev/.+",fstype!~"vfat|msdos"}
                / (node_filesystem_files{job="node-exporter",device=~"/dev/.+",fstype!~"vfat|msdos"} > 0)
                and (node_filesystem_readonly{job="node-exporter",device=~"/dev/.+",fstype!~"vfat|msdos"} == 0)
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: { from: 0, to: 0 }
            model:
              refId: B
              datasource: { type: __expr__, uid: __expr__ }
              type: math
              expression: $A < 15
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'Less than 15% of inodes are free on {{ $labels.mountpoint }}'
          description: Check the mount for excessive numbers of small files.
